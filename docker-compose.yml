version: '3.8'

services:
  # Spring Boot API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

