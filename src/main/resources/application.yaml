spring:
  application:
    name: academic-system

  datasource:
    postgres-primary:
      jdbc-url: ${URL_DATABASE_POSTGRESQL:jdbc:postgresql://localhost:5432/academic_system}
      username: ${USERNAME_POSTGRESQL:postgres}
      password: ${PASSWORD_POSTGRESQL:postgres}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        idle-timeout: 120000
        max-lifetime: 300000
        connection-timeout: 10000
        pool-name: PostgresPool

    mysql-portal:
      jdbc-url: jdbc:mysql://${MYSQL_HOST:mysql-3de3b14e-system-academic-db.g.aivencloud.com}:${MYSQL_PORT:25624}/${MYSQL_DATABASE:system-academic-portal-public}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&connectTimeout=10000
      username: ${USERNAME_MYSQL:avnadmin}
      password: ${PASSWORD_MYSQL:avnadmin}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        idle-timeout: 120000
        max-lifetime: 300000
        connection-timeout: 10000
        pool-name: MySqlPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587} #587 solo si se usa google
    username: ${MAIL_USERNAME:tuemail@gmail.com}
    password: ${MAIL_PASSWORD:xxxx xxxx xxxx xxxx}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false} # Cambiado a 'ssl.enabled'
server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:academic-system-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

security:
  password:
    expiry-days: 90
    min-length: 6
  login:
    max-attempts: 5
    lock-duration-minutes: 30
  rate-limit:
    login-attempts: 10
    recovery-attempts: 3

otp:
  expiration-minutes: 5
  length: 6
